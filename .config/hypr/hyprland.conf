source=~/.config/hypr/keybinds.conf
source=~/.config/hypr/env.conf
source=~/.config/hypr/monitor.conf

# Core components (authentication, lock screen, notification daemon)
exec-once = dbus-update-activation-environment --systemd
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = dunst &
exec-once = hypridle
exec-once = wlsunset -l 21.8 -L -102.2 -t 5000 -T 6500
exec-once = /usr/bin/pypr
exec-once = /usr/bin/easyeffects --gapplication-service

# Status bar
exec-once = waybar

# Fix cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# Setup resolution for monitor (laptop)
#monitor=,highres,auto,1

# Something
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Wallpaper script
exec-once = sleep 3 & bash $HOME/.config/hypr/scripts/wallpaper-daemon &

# System config

input {
  kb_layout= us,latam
  kb_variant=
  kb_model=
  kb_options=grp:alt_shift_toggle
  kb_rules=

  follow_mouse=1
  numlock_by_default=1

  touchpad {
    natural_scroll=yes
  }
}

gestures {
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 10
  workspace_swipe_cancel_ratio = 0.85
}


general {
  gaps_in=2
  gaps_out=10
  border_size=3
  col.active_border=0xff7c94bf
  col.inactive_border=0x00ffffff
  layout=master
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  vfr = true
  vrr = 0
  animate_manual_resizes = true
  mouse_move_focuses_monitor = true
}

# window decorations and styling

decoration {
  rounding=6
  active_opacity=1
  inactive_opacity=1
}

animations {
  enabled=1

  animation=windows,1,2,default
  animation=border,1,10,default
  animation=fade,0,5,default
  animation=workspaces,1,4,default
}

# Window rules
# Popping windows
windowrule=match:class qalc-popterm,float true,pin true
windowrule=match:class foot-popterm,float true,pin true

# Dialogs
windowrule=match:title ^(Open File)(.*)$, float true
windowrule=match:title ^(Select a File)(.*)$, float true
windowrule=match:title ^(Choose wallpaper)(.*)$, float true
windowrule=match:title ^(Open Folder)(.*)$, float true
windowrule=match:title ^(Save As)(.*)$, float true
windowrule=match:title ^(Library)(.*)$, float true

# Layer rules
layerrule = match:namespace eww, blur true
layerrule = match:namespace eww, ignore_alpha 0.69
layerrule = match:namespace eww-lowopacity, blur true
layerrule = match:namespace eww-lowopacity, ignore_alpha 0.39
layerrule = match:namespace supercontext, blur true
layerrule = match:namespace supercontext, ignore_alpha 0.84
layerrule = match:namespace gtk-layer-shell, blur true
layerrule = match:namespace launcher, blur true
layerrule = match:namespace notifications, blur true
layerrule = match:namespace notifications, ignore_alpha 0.69
